name: Source quality-stop PostgreSQL integration

on:
  pull_request:
    paths:
      - "server/research-full-run-stages.js"
      - "server/research-person-source-cycles.js"
      - "server/research-person-source-executor.js"
      - "test/ai98-zero-yield-postgres.integration.test.js"
      - "server/research-funnel-snapshot-loader.js"
      - "test/research-funnel-snapshot-loader.postgres.integration.test.js"
      - "prisma/**"
      - ".github/workflows/source-quality-stop-db.yml"
  push:
    branches: [main]
    paths:
      - "server/research-full-run-stages.js"
      - "server/research-person-source-cycles.js"
      - "server/research-person-source-executor.js"
      - "test/ai98-zero-yield-postgres.integration.test.js"
      - "server/research-funnel-snapshot-loader.js"
      - "test/research-funnel-snapshot-loader.postgres.integration.test.js"
      - "prisma/**"
      - ".github/workflows/source-quality-stop-db.yml"

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: snapycall_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d snapycall_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/snapycall_ci?schema=public
      DIRECT_URL: postgresql://test:test@localhost:5432/snapycall_ci?schema=public
      AI98_TEST_POSTGRES: isolated-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: node --test test/ai98-zero-yield-postgres.integration.test.js test/research-funnel-snapshot-loader.postgres.integration.test.js
