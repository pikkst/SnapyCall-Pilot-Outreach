name: Pilot app CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_password
          POSTGRES_USER: postgres
          POSTGRES_DB: pilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:ci_password@localhost:5432/pilot_test
      DIRECT_URL: postgresql://postgres:ci_password@localhost:5432/pilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run typecheck
      - run: npm run db:validate
      - run: npm run db:deploy
      - run: npx prisma migrate status
      - name: AI98 real PostgreSQL zero-yield lifecycle and claim fencing
        env:
          AI98_TEST_POSTGRES: isolated-ci
        run: node --test test/ai98-zero-yield-postgres.integration.test.js
      - name: Verify upgrade from prior migrations preserves owner budgets
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE pilot_upgrade'
          UPGRADE_URL="${DATABASE_URL%/*}/pilot_upgrade"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cp prisma/schema.prisma "$tmp/schema.prisma"
          mkdir -p "$tmp/migrations"
          cp prisma/migrations/migration_lock.toml "$tmp/migrations/"
          for directory in prisma/migrations/*/; do
            case "$directory" in
              *20261115040000_reconciliation_alert_outbox/) continue ;;
            esac
            cp -R "$directory" "$tmp/migrations/"
          done
          DATABASE_URL="$UPGRADE_URL" DIRECT_URL="$UPGRADE_URL" \
            npx prisma migrate deploy --schema "$tmp/schema.prisma"
          psql "$UPGRADE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "ResearchOwnerBudget" ("ownerId", "monthlyLimitCents")
          VALUES ('caaaaaaaaaaaaaaaaaaaaaaaa', 1000);
          SQL
          DATABASE_URL="$UPGRADE_URL" DIRECT_URL="$UPGRADE_URL" \
            npx prisma migrate deploy --schema prisma/schema.prisma
          outbox_exists="$(psql "$UPGRADE_URL" -At -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='ResearchReconciliationOutbox'")"
          test "$outbox_exists" = "1"
          preserved_budget="$(psql "$UPGRADE_URL" -At -v ON_ERROR_STOP=1 <<'SQL'
          SELECT "monthlyLimitCents" FROM "ResearchOwnerBudget"
          WHERE "ownerId" = 'caaaaaaaaaaaaaaaaaaaaaaaa';
          SQL
          )"
          test "$preserved_budget" = "1000"
      - run: npm run build
      - name: HTTP smoke against disposable PostgreSQL
        run: node scripts/smoke.mjs
      - name: Verify database tables
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public."Candidate"') IS NULL OR
               to_regclass('public."AiSetting"') IS NULL OR
               to_regclass('public."OutreachDraft"') IS NULL OR
               to_regclass('public."AuditEvent"') IS NULL OR
               to_regclass('public."AdminCredential"') IS NULL
            THEN RAISE EXCEPTION 'Missing application tables'; END IF;
          END $$;
          SQL
